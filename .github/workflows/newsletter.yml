name: Daily Stock Newsletter

on:
  schedule:
    # 매일 오전 7시 EST (UTC-5) = UTC 12:00
    # 서머타임(EDT, UTC-4) 적용 시 = 오전 8시 EDT
    - cron: '0 12 * * 1-5'  # UTC 12:00 → EST 7:00AM / EDT 8:00AM (평일)
  workflow_dispatch:  # 수동 실행 가능

# GitHub Pages 배포를 위한 권한
permissions:
  contents: write
  pages: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py

      - name: Commit and push newsletter HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || (git commit -m "Add newsletter $(date +%Y%m%d)" && git push)
